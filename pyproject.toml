[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "HCiw"
dynamic = ["version"]
description = "A discrete event simulation library for open queueing networks, forked from Ciw"
readme = "README.rst"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    { name = "Galen Seilis", email = "galen.seilis@seilis.ca" },
    { name = "Geraint Palmer", email = "palmer.geraint@googlemail.com" },
]
keywords = ["simulation", "queueing", "discrete event simulation", "healthcare"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "networkx>=2.3",
    "tqdm>=4.66.3",
    "numpy>=1.21.6",
]

[project.urls]
Homepage = "https://github.com/galenseilis/HCiw"
Repository = "https://github.com/galenseilis/HCiw"
"Upstream Ciw" = "https://github.com/CiwPython/Ciw"

[dependency-groups]
dev = [
    "hypothesis",
    "coverage",
    "pandas",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    "pyright",
    "ruff>=0.14.0",
]

[tool.pyright]
include = ["hciw"]
exclude = ["old", "docs", ".venv", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["old", "docs", ".venv"]

[tool.ruff.lint]
# Enable every stable rule, then carve out the specific rules that conflict with
# other rules, with the formatter, or with deliberate project conventions. Each
# exclusion below is documented; the intent is to keep this list as small and as
# justified as possible.
select = ["ALL"]
ignore = [
    # --- Rules that contradict the Ruff formatter (the formatter owns these). ---
    "COM812", # trailing comma missing; conflicts with `ruff format`
    "COM819", # trailing comma prohibited; conflicts with `ruff format`
    "ISC001", # single-line implicit string concat; conflicts with `ruff format`
    "Q000",   # bad quotes; the formatter normalises quote style
    "Q001",   # bad quotes in multiline string
    "Q002",   # bad docstring quotes
    "Q003",   # avoidable escaped quote
    # --- Deliberate project choices. ---
    # `assert` is used throughout the library for internal invariants and for
    # type narrowing; these are intentional and are stripped under `-O`.
    "S101",
    # The suite is written with `unittest`, so the pytest-style equivalents of
    # unittest idioms (bare asserts, pytest.raises) are intentionally not used.
    "PT009",  # pytest-style: use of unittest asserts
    "PT027",  # pytest-style: use of unittest raises
    # --- Deferred refactors (tracked in ROADMAP.md). ---
    # A full type-annotation layer is a separate, large effort; Google Style
    # treats annotations as optional. See ROADMAP.md.
    "ANN001", # missing type annotation for function argument
    "ANN201", # missing return type annotation for public function
    "ANN202", # missing return type annotation for private function
    "ANN204", # missing return type annotation for special method
    "ANN401", # dynamically typed expression (`Any`)
    # --- Rules that conflict with established/library conventions. ---
    # Unused parameters are overwhelmingly base-class/interface signatures (the
    # `_sample(self, t, ind)` distribution interface, routing hooks, etc.).
    # Re-annotating them would desynchronise the documented interface.
    "ARG001", # unused function argument
    "ARG002", # unused method argument
    # Opinionated exception-message rules; Google Style and PEP 8 are silent on
    # this, and the codebase favours inline messages.
    "TRY003", # long messages outside the exception class
    "EM101",  # exception must not use a string literal
    "EM102",  # exception must not use an f-string literal
    # Access to underscore-prefixed members is intentional within the library
    # and in tests that exercise private helpers.
    "SLF001", # private member accessed
    # Attribution is centralised in LICENSE.txt and AUTHORS.md rather than in
    # per-file copyright headers.
    "CPY001", # missing copyright notice at top of file
    # Boolean positional parameters (``completed=False``, ``exact=False``,
    # ``progress_bar=False``, ...) are part of the Ciw-derived public API;
    # making them keyword-only would break source compatibility with Ciw.
    "FBT001", # boolean-typed positional argument in function definition
    "FBT002", # boolean default positional argument in function definition
]

[tool.ruff.lint.per-file-ignores]
# Star imports are the project's intentional re-export pattern; F403/F405 are
# unavoidable false positives there.
"hciw/__init__.py" = ["F403", "F405"]
"hciw/dists/__init__.py" = ["F403", "F405"]
"hciw/deadlock/__init__.py" = ["F403", "F405"]
"hciw/import_params.py" = ["F403", "F405"]
"hciw/dists/distributions.py" = ["F403", "F405", "S311"]
"hciw/node.py" = ["F403", "F405"]
"hciw/routing/__init__.py" = ["F403", "F405"]
"hciw/trackers/__init__.py" = ["F403", "F405"]
"hciw/simulation.py" = ["F403", "F405"]
# DES library: random.random() is the intended RNG, not cryptography.
"hciw/arrival_node.py" = ["S311"]
"hciw/auxiliary.py" = ["S311"]
"tests/test_auxiliary.py" = ["S311"]
"tests/test_process_based.py" = ["S311"]
"tests/test_sampling.py" = ["S311"]
# FIFO/SIRO/LIFO are the public service-discipline names (queueing acronyms).
"hciw/disciplines.py" = ["N802"]
# --- Test-suite conventions. ---
"tests/**" = [
    "D",       # tests are self-describing; docstrings are not required
    "FBT",     # positional booleans are idiomatic in test setup
    "N803",    # argument names such as `N`, `Q` come from the tutorials
    "N805",    # first argument of a test helper is not always `self`
    "N806",    # `N` (network) / `Q` (simulation) notation from the tutorials
    "PLR0915", # long test methods bundle many assertions by design
    "PLR2004", # magic values are inherent to example-based tests
    "PTH",     # simple `os.path` usage in short test helpers
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["hciw*"]

[tool.setuptools.dynamic]
version = { attr = "hciw.version.__version__" }
