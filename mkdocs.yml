site_name: HCiw
site_description: A discrete event simulation library for open queueing networks, forked from Ciw.
site_url: https://galenseilis.github.io/HCiw/
repo_url: https://github.com/galenseilis/HCiw
repo_name: galenseilis/HCiw
edit_uri: edit/main/docs/
copyright: >-
  &copy; 2026 Galen Seilis; 2015 Geraint Palmer. HCiw is a fork of the
  <a href="https://github.com/CiwPython/Ciw">Ciw</a> library, used under the MIT licence.

theme:
  name: material
  logo: _static/hciw-logo.svg
  favicon: _static/hciw-favicon.svg
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - _static/style.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            docstring_options:
              returns_named_value: false
              warn_missing_types: false
            members: true
            filters: ["!^_"]
            members_order: source
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true

not_in_nav: |
  _static/**

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

